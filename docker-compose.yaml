services:
  flightpostgresdb:
    image: postgres:15
    container_name: flight_service_db_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flight_service_db
    ports:
      - "5430:5432"# HOST_PORT : CONTAINER_PORT
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flight_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  flightservice:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "44441:54322" # HOST_PORT : CONTAINER_PORT
    depends_on:
      flightpostgresdb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://flightpostgresdb:5432/flight_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - shared-network

networks:
  shared-network:
    external: true

volumes:
  pg_data: